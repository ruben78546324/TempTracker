<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TempTracker | Consulta del clima</title><link rel="icon" href="assets/clima.svg" type="image/svg+xml"><link rel="stylesheet" href="estilos.css"><script src="app.js" defer></script></head><body>
<main class="contenedor"><header><p class="marca">TEMP<span>TRACKER</span></p><h1>Tu compañero climático</h1><p class="introduccion">Consulta el clima actual de una ciudad antes de tu próxima aventura.</p><img class="clima-ejemplo" src="assets/clima-ejemplo.webp" alt="" aria-hidden="true"></header>
<form class="buscador" id="buscador"><label class="sr" for="ciudad">Ciudad</label><input id="ciudad" name="ciudad" type="search" placeholder="Ej. Huancayo" autocomplete="off" required maxlength="100"><button type="submit"><img src="assets/buscar.png" alt=""> Buscar</button></form><p class="estado" id="estado" role="status" aria-live="polite">Ingresa una ciudad para consultar el clima.</p>
<section class="resultado" id="resultado" hidden aria-label="Clima actual"><div class="ubicacion"><div><p class="etiqueta">CLIMA ACTUAL</p><h2 id="lugar"></h2><p id="fecha"></p></div><img class="ico" id="icono" src="assets/clima.svg" alt=""></div><div class="principal"><strong id="temperatura"></strong><div><span id="condicion"></span><p>Temperatura del aire</p></div></div><div class="detalles"><article><img class="detalle-icono" src="assets/humedad.png" alt=""><span>Humedad</span><strong id="humedad"></strong></article><article><img class="detalle-icono" src="assets/viento.webp" alt=""><span>Viento</span><strong id="viento"></strong></article></div><p class="fuente" id="fuente">Fuente: WeatherAPI.com</p></section><footer>Datos meteorológicos de <a href="https://www.weatherapi.com/" target="_blank" rel="noopener">WeatherAPI</a> · Consulta con conexión a internet</footer></main></body></html>
